      depth: 2
      ref_id: "Art. 7º"
      name: "Cadeia de fornecedores auditada"
      description: "Usar produtos/equipamentos de fornecedores que possuam política de segurança cibernética compatível com o Regulamento e realizem auditoria independente periódica, com resultados disponíveis à Anatel quando requisitados (facultada dispensa de startups, com responsabilização da prestadora)."
      parent_urn: urn:intuitem:risk:req_node:anatel-740-2020:node-31
    - urn: urn:intuitem:risk:req_node:anatel-740-2020:node-33
      assessable: true
      depth: 2
      ref_id: "Art. 8º"
      name: "Troca de senha padrão em comodato"
      description: "Alterar a configuração padrão de autenticação (senha padrão) dos equipamentos fornecidos em comodato aos usuários (rol de equipamentos e forma definidos pelo GT-Ciber)."
