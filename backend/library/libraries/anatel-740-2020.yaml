    description: "Requisitos avaliáveis do Regulamento de Segurança Cibernética Aplicada ao Setor de Telecomunicações (R-Ciber), aprovado pela Resolução ANATEL nº 740, de 21/12/2020 (texto consolidado com as alterações da Res. 767/2024). Recorte para gap-assessment de prestadoras de serviços de telecomunicações de interesse coletivo (exceto Pequeno Porte; princípios e diretrizes aplicam-se a todas). Onde a norma delega a forma e o prazo concretos ao GT-Ciber, isso é sinalizado. As definições do Art. 3 foram revogadas pela Res. 779/2025 e não constam."
