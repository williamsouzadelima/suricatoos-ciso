      description: "Notificar a Anatel sempre que for exigida a comunicação de incidente de segurança à ANPD (LGPD/regulamentação aplicável)."
      parent_urn: urn:intuitem:risk:req_node:anatel-740-2020:node-31
    - urn: urn:intuitem:risk:req_node:anatel-740-2020:node-36
