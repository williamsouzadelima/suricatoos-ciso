      description: "Tratar os aspectos de segurança da contratação de processamento/armazenamento de dados e computação em nuvem: capacidade do fornecedor, mapeamento de riscos, controles de mitigação e a complexidade da gestão de incidentes quando os dados estiverem no exterior."
