      name: "Cap. III — Requisitos e governança da PSC (Art. 5º)"
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-23
      assessable: true
      depth: 2
      ref_id: "Art. 5º, I-II"
      name: "Proporcionalidade ao risco"
      description: "A PSC deve ser compatível com a relevância da instalação no contexto do SIN, a natureza e a complexidade dos serviços/atividades/processos/sistemas e com a sensibilidade dos dados sob responsabilidade do agente."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-24
      assessable: true
      depth: 2
      ref_id: "Art. 5º, III"
      name: "Disseminação por níveis e papéis"
      description: "Disseminar a PSC aos profissionais e colaboradores das áreas afetas, nos diversos níveis, papéis e responsabilidades, resguardando o compartilhamento de informações críticas apenas a quem executa diretamente a política."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-25
      assessable: true
      depth: 2
      ref_id: "Art. 5º, IV"
      name: "Responsabilidades e ponto focal de urgência"
      description: "Estabelecer as responsabilidades pela aplicação da política, identificando pessoas e áreas competentes e um ponto focal para contato em situações de urgência."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-26
      assessable: true
      depth: 2
      ref_id: "Art. 5º, V"
      name: "Dirigente responsável"
      description: "Designar dirigente responsável pela política de segurança cibernética (pode acumular funções, desde que sem conflito de interesses)."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-27
      assessable: true
      depth: 2
      ref_id: "Art. 5º, VI"
      name: "Aprovação pelo Conselho de Administração"
      description: "A PSC deve ser aprovada pelo Conselho de Administração ou por órgão de deliberação colegiado equivalente."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-28
      assessable: true
      depth: 2
      ref_id: "Art. 5º, VII"
      name: "Revisão periódica"
      description: "Revisar e atualizar a PSC periodicamente e sempre que necessário."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-29
      assessable: true
      depth: 2
      ref_id: "Art. 5º, VIII"
      name: "Disponibilidade à ANEEL"
      description: "Manter a PSC disponível à ANEEL sempre que solicitada, com os documentos complementares e os comprovantes de aprovação interna."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-30
      assessable: true
      depth: 2
      ref_id: "Art. 5º, p.ú."
      name: "Governança de grupo econômico"
      description: "Quando a estrutura de governança da PSC for única para o grupo econômico, identificar o agente responsável, em níveis e funções, quando aplicável."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-22
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-31
      assessable: false
      depth: 1
      ref_id: "CAP-IV"
      name: "Cap. IV — Notificação e compartilhamento de incidentes (Art. 6º, 7º)"
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-32
      assessable: true
      depth: 2
      ref_id: "Art. 6º"
      name: "Notificação de incidentes de maior impacto"
      description: "Notificar a equipe de coordenação setorial designada os incidentes de maior impacto que afetem substancialmente a segurança das instalações, a operação, os serviços aos usuários ou os dados, incluindo a análise da causa e do impacto e as ações de mitigação, assim que o agente tiver ciência do incidente e de sua dimensão. A notificação não exclui outras obrigações legais (ex.: LGPD/ANPD)."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-31
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-33
      assessable: true
      depth: 2
      ref_id: "Art. 7º"
      name: "Compartilhamento de informações sobre ameaças"
      description: "Adotar procedimento de compartilhamento de informações sobre ameaças e demais informações de segurança cibernética, de forma sigilosa e não discriminatória, facultado o anonimato, não restrito às empresas do mesmo grupo societário e sem abranger informações críticas ou que comprometam a segurança do agente."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-31
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-34
      assessable: false
      depth: 1
      ref_id: "CAP-V"
      name: "Cap. V — Continuidade, registros e comprovação à ANEEL (Art. 8º, 9º)"
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-35
      assessable: true
      depth: 2
      ref_id: "Art. 8º"
      name: "Responsabilidade pela segurança e continuidade"
      description: "Assumir a responsabilidade pela segurança das instalações e pela continuidade na prestação do serviço; a adoção e a execução da PSC e demais condutas exigidas são ônus do agente."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-34
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-36
      assessable: true
      depth: 2
      ref_id: "Art. 9º"
      name: "Registros e comprovação à ANEEL"
      description: "Manter registros e enviar à ANEEL ou à equipe de coordenação setorial designada, quando solicitados: os resultados dos modelos de maturidade aplicados; os riscos cibernéticos identificados e a respectiva forma de tratamento; e os dados das equipes de prevenção, tratamento e resposta a incidentes."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-34
