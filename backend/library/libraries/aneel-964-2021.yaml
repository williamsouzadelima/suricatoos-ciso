      description: "Prever simulações de cenários e ameaças para testes de resiliência, análise de ferramentas e avaliação da capacidade e do tempo de resposta."
      parent_urn: urn:intuitem:risk:req_node:aneel-964-2021:node-8
    - urn: urn:intuitem:risk:req_node:aneel-964-2021:node-19
