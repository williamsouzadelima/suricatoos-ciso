ref_id: ANEEL-964-2021
name: "REN ANEEL nº 964/2021 — Segurança Cibernética (Setor de Energia Elétrica)"
description: "Requisitos avaliáveis da Resolução Normativa ANEEL nº 964, de 14/12/2021 (vigente desde 01/07/2022), que dispõe sobre a política de segurança cibernética (PSC) a ser adotada pelos agentes do setor de energia elétrica (geração, transmissão, distribuição, operação do sistema — ONS, comercialização e gestão de encargos). Norma principiológica e baseada em risco: não lista controles técnicos por nome (MFA, criptografia, backup) — a conformidade é avaliada por adequação e maturidade, e os controles concretos derivam das normas, padrões e boas práticas que o agente adota (Art. 3º, I). Recorte de gap-assessment sobre os Art. 3º a 9º; a proporcionalidade é qualitativa (relevância no SIN e sensibilidade dos dados), sem dispensa de agentes. Os Procedimentos de Rede do ONS e a LGPD/ANPD são camadas complementares."
copyright: Construido a partir de conteudo publico oficial (ANEEL) por Suricatoos. Norma principiologica/baseada em risco; requer validacao de compliance antes de uso regulatorio. Procedimentos de Rede do ONS e LGPD/ANPD sao camadas complementares.
version: 1
provider: Suricatoos
packager: suricatoos
