urn: urn:intuitem:risk:preset:nist-csf-2.0-journey
locale: en
ref_id: preset-nist-csf-2.0-journey
name: NIST CSF 2.0 — Full Organisational Journey
description: End-to-end cybersecurity programme journey aligned to the NIST Cybersecurity Framework 2.0. Covers all six Functions (Govern, Identify, Protect, Detect, Respond, Recover) with structured risk assessment, asset inventory, compliance assessment, policy creation, and control implementation — from initial scoping through to continuous improvement.
version: 1
provider: Paul Flatt
packager: Paul Flatt
translations:
  fr:
    name: NIST CSF 2.0 — Parcours organisationnel complet
    description: Parcours de programme de cybersécurité de bout en bout aligné sur le NIST Cybersecurity Framework 2.0. Couvre les six fonctions avec évaluation des risques structurée, inventaire des actifs, évaluation de conformité, création de politiques et mise en œuvre des contrôles.
  pt:
    name: NIST CSF 2.0 — Jornada Organizacional Completa
    description: Jornada ponta a ponta de um programa de cibersegurança alinhada ao NIST Cybersecurity Framework 2.0. Abrange as seis Funções (Governar, Identificar, Proteger, Detectar, Responder, Recuperar) com avaliação de riscos estruturada, inventário de ativos, avaliação de conformidade, criação de políticas e implementação de controles — do escopo inicial até a melhoria contínua.
dependencies:
- urn:intuitem:risk:library:nist-csf-2.0-journey
- urn:intuitem:risk:library:risk-matrix-5x5-iso27005
objects:
  preset:
    profile:
      company_size:
      - sme
      - large
      - enterprise
      industry:
      - general
      - critical-infrastructure
      - financial
      - healthcare
      - government
      region:
      - global
      goal: security-programme
    feature_flags:
      enable:
      - compliance
      - metrology
      - tprm
      - organisation_issues
      - organisation_objectives
      - tasks
      - follow_up
    scaffolded_objects:
    - type: organisation_issue
      name: Regulatory and legal compliance obligations
      description: Applicable laws, regulations, and contractual obligations imposing cybersecurity requirements on the organisation (e.g. Privacy Act, NZISM, sector-specific regulations, contractual SLAs).
      category: legal
      origin: external
      status: active
      translations:
        fr:
          name: Obligations réglementaires et légales
          description: Lois, réglementations et obligations contractuelles imposant des exigences de cybersécurité à l'organisation.
        pt:
          name: Obrigações regulatórias e legais de conformidade
          description: Leis, regulamentos e obrigações contratuais aplicáveis que impõem requisitos de cibersegurança à organização (por exemplo, LGPD, Marco Civil da Internet, regulamentações setoriais como as do BACEN ou da ANPD, SLAs contratuais).
    - type: organisation_issue
      name: Evolving cyber threat landscape
      description: External threat environment including ransomware groups, nation-state actors, phishing campaigns, supply chain attacks, and emerging threats relevant to the organisation's sector and geography.
      category: technology
      origin: external
      status: active
      translations:
        fr:
          name: Paysage des cybermenaces en évolution
          description: Environnement de menaces externes incluant les rançongiciels, acteurs étatiques, hameçonnage, attaques de la chaîne d'approvisionnement et menaces émergentes pertinentes pour le secteur.
        pt:
          name: Cenário de ameaças cibernéticas em evolução
          description: Ambiente externo de ameaças, incluindo grupos de ransomware, atores patrocinados por Estados-nação, campanhas de phishing, ataques à cadeia de suprimentos e ameaças emergentes relevantes para o setor e a região geográfica da organização.
    - type: organisation_issue
      name: Third-party and supply chain dependencies
      description: Reliance on vendors, managed service providers, cloud platforms, and supply chain partners that introduce cybersecurity risk through trusted access, shared systems, and data processing relationships.
      category: technology
      origin: external
      status: active
      translations:
        fr:
          name: Dépendances tierces et chaîne d'approvisionnement
          description: Dépendance envers des fournisseurs, prestataires de services managés, plateformes cloud et partenaires qui introduisent des risques cybersécurité.
        pt:
          name: Dependências de terceiros e da cadeia de suprimentos
          description: Dependência de fornecedores, provedores de serviços gerenciados, plataformas de nuvem e parceiros da cadeia de suprimentos que introduzem risco de cibersegurança por meio de acesso confiável, sistemas compartilhados e relações de tratamento de dados.
    - type: organisation_issue
      name: Current cybersecurity maturity and capability gaps
      description: Internal assessment of the organisation's existing security practices, tooling, skills, and process maturity that influence CSF programme priorities and implementation sequencing.
      category: internalProcesses
      origin: internal
      status: active
      translations:
        fr:
          name: Maturité cybersécurité actuelle et lacunes de capacité
          description: Évaluation interne des pratiques de sécurité existantes, des outils, compétences et maturité des processus qui influencent les priorités du programme CSF.
        pt:
          name: Maturidade atual de cibersegurança e lacunas de capacidade
          description: Avaliação interna das práticas de segurança, ferramentas, competências e maturidade de processos existentes na organização, que influenciam as prioridades do programa CSF e o sequenciamento da implementação.
    - type: organisation_issue
      name: Technology and cloud adoption changes
      description: Internal adoption of new technologies including cloud services, SaaS platforms, AI tools, and remote work infrastructure that expand the attack surface and require updated security controls.
      category: technology
      origin: internal
      status: active
      translations:
        fr:
          name: Changements d’adoption technologique et cloud
          description: Adoption interne de nouvelles technologies incluant les services cloud, plateformes SaaS, outils IA et infrastructure de travail à distance qui élargissent la surface d’attaque.
        pt:
          name: Mudanças na adoção de tecnologia e nuvem
          description: Adoção interna de novas tecnologias, incluindo serviços de nuvem, plataformas SaaS, ferramentas de IA e infraestrutura de trabalho remoto, que ampliam a superfície de ataque e exigem controles de segurança atualizados.
    - type: organisation_issue
      name: Workforce security awareness and culture
      description: The level of security awareness, risk culture, and security behaviour among staff and contractors. Low awareness increases susceptibility to phishing, social engineering, and policy non-compliance.
      category: humanResources
      origin: internal
      status: active
      translations:
        fr:
          name: Sensibilisation et culture sécurité du personnel
          description: Niveau de sensibilisation à la sécurité, de culture du risque et de comportement sécuritaire parmi le personnel et les prestataires.
        pt:
          name: Conscientização e cultura de segurança da força de trabalho
          description: O nível de conscientização em segurança, cultura de risco e comportamento seguro entre colaboradores e prestadores de serviço. Baixa conscientização aumenta a suscetibilidade a phishing, engenharia social e descumprimento de políticas.
    - type: organisation_objective
      name: Establish and maintain a cybersecurity governance framework
      description: Define and operationalise cybersecurity roles, responsibilities, policies, and risk appetite across the organisation with documented executive accountability.
      status: in_progress
      translations:
        fr:
          name: Établir et maintenir un cadre de gouvernance cybersécurité
          description: Définir et opérationnaliser les rôles, responsabilités, politiques et appétit au risque cybersécurité avec une responsabilité exécutive documentée.
        pt:
          name: Estabelecer e manter uma estrutura de governança de cibersegurança
          description: Definir e operacionalizar papéis, responsabilidades, políticas e apetite ao risco de cibersegurança em toda a organização, com responsabilização executiva documentada.
    - type: organisation_objective
      name: Achieve and maintain acceptable cybersecurity risk levels
      description: Ensure all identified cybersecurity risks are assessed and treated to within the organisation's risk appetite, with residual risks formally accepted by risk owners.
      status: draft
      translations:
        fr:
          name: Atteindre et maintenir des niveaux de risque cybersécurité acceptables
          description: S’assurer que tous les risques cybersécurité identifiés sont évalués et traités dans les limites de l’appétit au risque, avec une acceptation formelle par les propriétaires de risques.
        pt:
          name: Alcançar e manter níveis aceitáveis de risco de cibersegurança
          description: Garantir que todos os riscos de cibersegurança identificados sejam avaliados e tratados dentro do apetite ao risco da organização, com os riscos residuais formalmente aceitos pelos responsáveis pelo risco.
    - type: organisation_objective
      name: Improve detection and response capabilities
      description: Reduce mean time to detect (MTTD) and mean time to respond (MTTR) for cybersecurity incidents through improved monitoring, alerting, and incident response processes.
      status: draft
      translations:
        fr:
          name: Améliorer les capacités de détection et de réponse
          description: Réduire le temps moyen de détection et de réponse aux incidents cybersécurité grâce à une surveillance, des alertes et des processus de réponse améliorés.
        pt:
          name: Aprimorar as capacidades de detecção e resposta
          description: Reduzir o tempo médio de detecção (MTTD) e o tempo médio de resposta (MTTR) a incidentes de cibersegurança por meio de melhorias em monitoramento, alertas e processos de resposta a incidentes.
    - type: organisation_objective
      name: Ensure resilient recovery from cyber incidents
      description: Maintain tested backup and recovery capabilities that meet defined RTO and RPO targets, ensuring the organisation can restore critical operations following a significant cyber incident.
      status: draft
      translations:
        fr:
          name: Assurer une reprise résiliente après les incidents cyber
          description: Maintenir des capacités de sauvegarde et de reprise testées répondant aux objectifs RTO et RPO définis, permettant la restauration des opérations critiques après un incident majeur.
        pt:
          name: Assegurar recuperação resiliente de incidentes cibernéticos
          description: Manter capacidades de backup e recuperação testadas que atendam às metas definidas de RTO e RPO, garantindo que a organização possa restaurar operações críticas após um incidente cibernético significativo.
    - type: organisation_objective
      name: Build and sustain a security-aware workforce
      description: Establish a security awareness programme so that all personnel understand their cybersecurity responsibilities, can recognise common threats, and adopt secure behaviours in their daily work.
      status: draft
      translations:
        fr:
          name: Développer et maintenir un personnel sensibilisé à la sécurité
          description: Établir un programme de sensibilisation à la sécurité pour que tout le personnel comprenne ses responsabilités cybersécurité et adopte des comportements sécuritaires au quotidien.
        pt:
          name: Desenvolver e sustentar uma força de trabalho consciente em segurança
          description: Estabelecer um programa de conscientização em segurança para que todo o pessoal compreenda suas responsabilidades de cibersegurança, saiba reconhecer ameaças comuns e adote comportamentos seguros em seu trabalho diário.
    - type: entity
      name: Board and Executive Leadership
      description: Senior decision-makers responsible for setting cybersecurity risk appetite, approving policies, and providing oversight of the organisation's cybersecurity programme. Aligned to GV.RR-01, GV.OC-02.
      translations:
        fr:
          name: Conseil d’administration et direction générale
          description: Décideurs seniors responsables de la définition de l’appétit au risque, de l’approbation des politiques et de la surveillance du programme cybersécurité.
        pt:
          name: Conselho e Liderança Executiva
          description: Tomadores de decisão sênior responsáveis por definir o apetite ao risco de cibersegurança, aprovar políticas e supervisionar o programa de cibersegurança da organização. Alinhado a GV.RR-01, GV.OC-02.
    - type: entity
      name: Regulators and Government Agencies
      description: Regulatory bodies, government agencies, and national cybersecurity organisations (e.g. CERT NZ, ACSC, sector regulators) that impose compliance obligations and incident reporting requirements. Aligned to GV.OC-03, RS.CO-02.
      translations:
        fr:
          name: Régulateurs et agences gouvernementales
          description: Organismes de réglementation, agences gouvernementales et organisations nationales de cybersécurité imposant des obligations de conformité et des exigences de notification d’incidents.
        pt:
          name: Reguladores e Órgãos Governamentais
          description: Órgãos reguladores, agências governamentais e organizações nacionais de cibersegurança (por exemplo, CERT.br, CTIR Gov, ANPD, reguladores setoriais como BACEN e ANATEL) que impõem obrigações de conformidade e requisitos de notificação de incidentes. Alinhado a GV.OC-03, RS.CO-02.
    - type: entity
      name: Customers and End Users
      description: Individuals and organisations that use the organisation's products or services and have expectations regarding the confidentiality, integrity, and availability of their data. Aligned to GV.OC-02, GV.OC-04.
      translations:
        fr:
          name: Clients et utilisateurs finaux
          description: Individus et organisations utilisant les produits ou services de l’organisation avec des attentes concernant la confidentialité, l’intégrité et la disponibilité de leurs données.
        pt:
          name: Clientes e Usuários Finais
          description: Indivíduos e organizações que utilizam os produtos ou serviços da organização e têm expectativas quanto à confidencialidade, integridade e disponibilidade de seus dados. Alinhado a GV.OC-02, GV.OC-04.
    - type: entity
      name: Managed Service Providers and Key Vendors
      description: Third-party organisations providing managed IT, security, or cloud services that have privileged access to or process data on behalf of the organisation. Aligned to GV.SC-01, GV.SC-07, GV.OC-05.
      translations:
        fr:
          name: Prestataires de services managés et fournisseurs clés
          description: Organisations tierces fournissant des services IT, de sécurité ou cloud managés ayant un accès privilégié ou traitant des données au nom de l’organisation.
        pt:
          name: Provedores de Serviços Gerenciados e Fornecedores Estratégicos
          description: Organizações terceiras que prestam serviços gerenciados de TI, segurança ou nuvem e que possuem acesso privilegiado ou tratam dados em nome da organização. Alinhado a GV.SC-01, GV.SC-07, GV.OC-05.
    - type: entity
      name: Cyber Insurers and Legal Counsel
      description: Cyber insurance providers and legal advisors who are engaged during significant incidents, influence risk transfer decisions, and have requirements relating to the organisation's security posture and incident notification. Aligned to GV.RM-04, RS.CO-02.
      translations:
        fr:
          name: Assureurs cyber et conseil juridique
          description: Prestataires d’assurance cyber et conseillers juridiques engagés lors d’incidents significatifs, influençant les décisions de transfert de risque et les exigences de notification d’incidents.
        pt:
          name: Seguradoras Cibernéticas e Assessoria Jurídica
          description: Provedores de seguro cibernético e assessores jurídicos que são acionados durante incidentes significativos, influenciam decisões de transferência de risco e possuem requisitos relacionados à postura de segurança da organização e à notificação de incidentes. Alinhado a GV.RM-04, RS.CO-02.
    - type: entity
      name: Employees and Contractors
      description: Internal workforce including permanent employees, contractors, and temporary staff who use organisational systems and are subject to cybersecurity policies, awareness training, and acceptable use obligations. Aligned to GV.RR-04, PR.AT-01.
      translations:
        fr:
          name: Employés et prestataires
          description: Personnel interne incluant les employés permanents, prestataires et personnel temporaire utilisant les systèmes de l’organisation et soumis aux politiques cybersécurité et aux obligations de formation.
        pt:
          name: Colaboradores e Prestadores de Serviço
          description: Força de trabalho interna, incluindo funcionários permanentes, prestadores de serviço e pessoal temporário que utilizam os sistemas organizacionais e estão sujeitos às políticas de cibersegurança, ao treinamento de conscientização e às obrigações de uso aceitável. Alinhado a GV.RR-04, PR.AT-01.
    - type: entity
      name: Industry and Threat Intelligence Partners
      description: Information sharing and analysis centres (ISACs), sector peers, and threat intelligence providers that share cybersecurity threat data and incident information to improve collective defence. Aligned to ID.RA-02, GV.OC-02.
      translations:
        fr:
          name: Partenaires sectoriels et de renseignement sur les menaces
          description: Centres de partage et d’analyse d’informations (ISAC), pairs sectoriels et fournisseurs de renseignement sur les menaces partageant des données pour améliorer la défense collective.
        pt:
          name: Parceiros do Setor e de Inteligência de Ameaças
          description: Centros de compartilhamento e análise de informações (ISACs), pares do setor e provedores de inteligência de ameaças que compartilham dados de ameaças cibernéticas e informações de incidentes para fortalecer a defesa coletiva. Alinhado a ID.RA-02, GV.OC-02.
    - type: findings_assessment
      name: Vulnerability Assessment and Penetration Test Findings
      category: pentest
      ref: pentest_findings
      translations:
        fr:
          name: Constats d’évaluation des vulnérabilités et de tests d’intrusion
        pt:
          name: Achados de Avaliação de Vulnerabilidades e Teste de Invasão
    - type: findings_assessment
      name: Detection and Response Capability Findings
      category: audit
      ref: detection_findings
      translations:
        fr:
          name: Constats sur les capacités de détection et de réponse
        pt:
          name: Achados de Capacidade de Detecção e Resposta
    - type: findings_assessment
      name: Business Continuity and Recovery Findings
      category: audit
      ref: bcdr_findings
      translations:
        fr:
          name: Constats sur la continuité d’activité et la reprise
        pt:
          name: Achados de Continuidade de Negócios e Recuperação
    - type: risk_assessment
      name: NIST CSF 2.0 — Enterprise Risk Assessment
      description: Structured risk assessment aligned to NIST CSF 2.0 Govern and Identify functions. Evaluates likelihood and impact across the organisation's key asset categories and threat scenarios.
      risk_matrix: urn:intuitem:risk:library:risk-matrix-5x5-iso27005
      ref: main_ra
      translations:
        fr:
          name: NIST CSF 2.0 — Évaluation des risques d’entreprise
          description: Évaluation des risques structurée alignée sur les fonctions Gouverner et Identifier du NIST CSF 2.0.
        pt:
          name: NIST CSF 2.0 — Avaliação de Riscos Corporativa
          description: Avaliação de riscos estruturada alinhada às funções Governar e Identificar do NIST CSF 2.0. Avalia a probabilidade e o impacto nas principais categorias de ativos e cenários de ameaça da organização.
    - type: compliance_assessment
      name: NIST CSF 2.0 — Full Framework Assessment
      description: Assessment across all six CSF 2.0 Functions and associated Categories and Subcategories. Produces a maturity baseline and gap analysis for each function.
      framework: urn:intuitem:risk:library:nist-csf-2.0-journey
      create_suggested_controls: true
      ref: csf_audit
      translations:
        fr:
          name: NIST CSF 2.0 — Évaluation complète du cadre
          description: Évaluation couvrant les six fonctions du CSF 2.0 et leurs catégories et sous-catégories associées.
        pt:
          name: NIST CSF 2.0 — Avaliação Completa do Framework
          description: Avaliação que abrange todas as seis Funções do CSF 2.0 e suas Categorias e Subcategorias associadas. Produz uma linha de base de maturidade e uma análise de lacunas para cada função.
    - type: asset
      name: IT Infrastructure
      description: Servers, network equipment, firewalls, switches, and cloud infrastructure supporting business operations.
      asset_type: SP
      ref: asset_infra
      translations:
        fr:
          name: Infrastructure informatique
          description: Serveurs, équipements réseau, pare-feux, commutateurs et infrastructure cloud.
        pt:
          name: Infraestrutura de TI
          description: Servidores, equipamentos de rede, firewalls, switches e infraestrutura de nuvem que sustentam as operações de negócio.
    - type: asset
      name: Endpoints and User Devices
      description: Laptops, desktops, tablets, and smartphones used by employees and contractors.
      asset_type: SP
      ref: asset_endpoints
      translations:
        fr:
          name: Postes de travail et appareils utilisateurs
          description: Ordinateurs portables, fixes, tablettes et smartphones utilisés par les employés et prestataires.
        pt:
          name: Endpoints e Dispositivos de Usuário
          description: Notebooks, desktops, tablets e smartphones utilizados por colaboradores e prestadores de serviço.
    - type: asset
      name: Identity and Access Management Systems
      description: Directory services, SSO platforms, MFA systems, and privileged access management tooling.
      asset_type: SP
      ref: asset_iam
      translations:
        fr:
          name: Systèmes de gestion des identités et des accès
          description: Services d’annuaire, SSO, MFA et outils de gestion des accès privilégiés.
        pt:
          name: Sistemas de Gestão de Identidade e Acesso
          description: Serviços de diretório, plataformas de SSO, sistemas de MFA e ferramentas de gestão de acesso privilegiado.
    - type: asset
      name: Business Applications
      description: ERP, CRM, finance, HR, and other core business applications — whether on-premises or SaaS.
      asset_type: SP
      ref: asset_apps
      translations:
        fr:
          name: Applications métier
          description: ERP, CRM, finance, RH et autres applications métier essentielles, sur site ou SaaS.
        pt:
          name: Aplicações de Negócio
          description: ERP, CRM, finanças, RH e outras aplicações essenciais de negócio — sejam on-premises ou SaaS.
    - type: asset
      name: Email and Collaboration Platforms
      description: Email services, messaging, file sharing, and video conferencing platforms (e.g. Microsoft 365, Google Workspace).
      asset_type: SP
      ref: asset_collab
      translations:
        fr:
          name: Messagerie et plateformes collaboratives
          description: Messagerie, fichiers partagés et visioconférence (ex. Microsoft 365, Google Workspace).
        pt:
          name: Plataformas de E-mail e Colaboração
          description: Serviços de e-mail, mensageria, compartilhamento de arquivos e plataformas de videoconferência (por exemplo, Microsoft 365, Google Workspace).
    - type: asset
      name: Sensitive and Regulated Data
      description: Personally identifiable information (PII), financial records, intellectual property, regulated data, and other critical information assets.
      asset_type: PR
      ref: asset_data
      translations:
        fr:
          name: Données sensibles et réglementées
          description: Données personnelles, financières, propriété intellectuelle, données réglementées et autres actifs informationnels critiques.
        pt:
          name: Dados Sensíveis e Regulados
          description: Dados pessoais (conforme a LGPD), registros financeiros, propriedade intelectual, dados regulados e outros ativos de informação críticos.
    - type: asset
      name: Operational Technology and IoT
      description: Industrial control systems, building management systems, and Internet of Things devices where applicable.
      asset_type: SP
      ref: asset_ot_iot
      translations:
        fr:
          name: Technologies opérationnelles et IoT
          description: Systèmes de contrôle industriel, gestion technique du bâtiment et objets connectés le cas échéant.
        pt:
          name: Tecnologia Operacional e IoT
          description: Sistemas de controle industrial, sistemas de automação predial e dispositivos de Internet das Coisas, quando aplicável.
    - type: asset
      name: Third-Party and Supply Chain Connections
      description: Vendor integrations, managed service providers, API connections, and supply chain dependencies.
      asset_type: SP
      ref: asset_supplychain
      translations:
        fr:
          name: Tiers et chaîne d’approvisionnement
          description: Intégrations fournisseurs, prestataires de services managés, connexions API et dépendances de la chaîne d’approvisionnement.
        pt:
          name: Conexões de Terceiros e da Cadeia de Suprimentos
          description: Integrações de fornecedores, provedores de serviços gerenciados, conexões de API e dependências da cadeia de suprimentos.
    - type: risk_scenario
      name: Inadequate cybersecurity governance and accountability
      description: Absence of defined cybersecurity roles, policies, or executive accountability results in uncoordinated security decisions and unmanaged organisational risk.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_infra
      - asset_data
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-govern
      translations:
        fr:
          name: Gouvernance cybersécurité insuffisante
          description: L’absence de rôles, politiques ou responsabilités exécutives définis entraîne des décisions de sécurité non coordonnées.
        pt:
          name: Governança e responsabilização de cibersegurança inadequadas
          description: A ausência de papéis, políticas ou responsabilização executiva de cibersegurança definidos resulta em decisões de segurança descoordenadas e em risco organizacional não gerenciado.
    - type: risk_scenario
      name: Unknown or unmanaged assets exploited
      description: Attackers target shadow IT, unmanaged devices, or undocumented systems that fall outside the organisation's visibility and patch management processes.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_endpoints
      - asset_infra
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-identify
      translations:
        fr:
          name: Actifs inconnus ou non gérés exploités
          description: Des attaquants ciblent le shadow IT, les appareils non gérés ou les systèmes non documentés hors de la visibilité de l’organisation.
        pt:
          name: Exploração de ativos desconhecidos ou não gerenciados
          description: Os atacantes visam shadow IT, dispositivos não gerenciados ou sistemas não documentados que estão fora da visibilidade e dos processos de gestão de patches da organização.
    - type: risk_scenario
      name: Credential theft via phishing or social engineering
      description: An employee is deceived into disclosing credentials through a phishing email or social engineering attack, granting unauthorised access to business systems.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_collab
      - asset_iam
      - asset_apps
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-protect-phishing
      translations:
        fr:
          name: Vol d’identifiants par hameçonnage ou ingénierie sociale
          description: Un employé divulgue ses identifiants via un email d’hameçonnage ou une attaque d’ingénierie sociale.
        pt:
          name: Roubo de credenciais por phishing ou engenharia social
          description: Um colaborador é enganado e divulga suas credenciais por meio de um e-mail de phishing ou de um ataque de engenharia social, concedendo acesso não autorizado aos sistemas de negócio.
    - type: risk_scenario
      name: Exploitation of unpatched software or systems
      description: Attackers exploit publicly known vulnerabilities in unpatched operating systems, applications, or network devices to achieve initial access or privilege escalation.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_endpoints
      - asset_infra
      - asset_apps
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-protect-vuln
      translations:
        fr:
          name: Exploitation de logiciels ou systèmes non mis à jour
          description: Des attaquants exploitent des vulnérabilités connues dans des systèmes, applications ou équipements réseau non corrigés.
        pt:
          name: Exploração de software ou sistemas sem correção
          description: Os atacantes exploram vulnerabilidades publicamente conhecidas em sistemas operacionais, aplicações ou dispositivos de rede sem correção para obter acesso inicial ou escalar privilégios.
    - type: risk_scenario
      name: Supply chain or third-party compromise
      description: A trusted vendor or managed service provider is compromised, providing attackers with a trusted pathway into the organisation's systems or data.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_supplychain
      - asset_data
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-protect-supplychain
      translations:
        fr:
          name: Compromission de la chaîne d’approvisionnement ou d’un tiers
          description: Un fournisseur ou prestataire de confiance est compromis, offrant aux attaquants un accès aux systèmes ou données de l’organisation.
        pt:
          name: Comprometimento da cadeia de suprimentos ou de terceiros
          description: Um fornecedor confiável ou provedor de serviços gerenciados é comprometido, oferecendo aos atacantes um caminho confiável para os sistemas ou dados da organização.
    - type: risk_scenario
      name: Undetected intrusion and lateral movement
      description: An attacker maintains persistent access and moves laterally across systems for an extended period without triggering detection, escalating privilege and exfiltrating data.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_infra
      - asset_data
      - asset_iam
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-detect-lateral
      translations:
        fr:
          name: Intrusion non détectée et mouvement latéral
          description: Un attaquant maintient un accès persistant et se déplace latéralement sans déclencher de détection, exfiltrant des données.
        pt:
          name: Intrusão não detectada e movimentação lateral
          description: Um atacante mantém acesso persistente e se movimenta lateralmente pelos sistemas por um período prolongado sem acionar a detecção, escalando privilégios e exfiltrando dados.
    - type: risk_scenario
      name: Ransomware deployment and business disruption
      description: Ransomware is deployed across endpoints and shared storage, encrypting critical business data and causing significant operational disruption and potential data loss.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_endpoints
      - asset_data
      - asset_apps
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-respond-ransomware
      translations:
        fr:
          name: Déploiement de rançongiciel et perturbation de l’activité
          description: Un rançongiciel est déployé sur les postes et le stockage partagé, chiffrant les données critiques et provoquant une perturbation opérationnelle majeure.
        pt:
          name: Implantação de ransomware e interrupção dos negócios
          description: O ransomware é implantado em endpoints e no armazenamento compartilhado, criptografando dados críticos de negócio e causando interrupção operacional significativa e potencial perda de dados.
    - type: risk_scenario
      name: Failure to recover from a significant cyber incident
      description: Inadequate backup, recovery procedures, or tested business continuity plans result in extended downtime and permanent data loss following a significant cyber incident.
      risk_assessment_ref: main_ra
      asset_refs:
      - asset_data
      - asset_infra
      - asset_apps
      threat_urns:
      - urn:intuitem:risk:threat:nist-csf-2.0:t-recover-bcdr
      translations:
        fr:
          name: Incapacité à se remettre d’un incident cyber majeur
          description: Des sauvegardes, procédures de reprise ou plans de continuité inadéquats entraînent une indisponibilité prolongée et une perte permanente de données.
        pt:
          name: Falha na recuperação de um incidente cibernético significativo
          description: Backups inadequados, procedimentos de recuperação deficientes ou planos de continuidade de negócios não testados resultam em indisponibilidade prolongada e perda permanente de dados após um incidente cibernético significativo.
    - type: task_template
      name: CSF programme governance review
      description: Review cybersecurity programme performance against the Target Profile, assess control effectiveness, and update risk appetite and objectives with senior leadership. Aligned to GV.OV-01, GV.OV-02, GV.OV-03.
      is_recurrent: true
      schedule:
        interval: 6
        frequency: MONTHLY
      translations:
        fr:
          name: Revue de gouvernance du programme CSF
          description: Revoir les performances du programme cybersécurité par rapport au profil cible, évaluer l’efficacité des contrôles et mettre à jour l’appétit au risque avec la direction.
        pt:
          name: Revisão de governança do programa CSF
          description: Revisar o desempenho do programa de cibersegurança em relação ao Perfil-Alvo, avaliar a eficácia dos controles e atualizar o apetite ao risco e os objetivos junto à alta liderança. Alinhado a GV.OV-01, GV.OV-02, GV.OV-03.
    - type: task_template
      name: Risk assessment review
      description: Review and update the cybersecurity risk assessment to account for changes in threats, vulnerabilities, assets, and business context. Aligned to ID.RA-06, ID.IM-03.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Revue de l’évaluation des risques
          description: Revoir et mettre à jour l’évaluation des risques cybersécurité pour tenir compte des évolutions des menaces, vulnérabilités, actifs et contexte métier.
        pt:
          name: Revisão da avaliação de riscos
          description: Revisar e atualizar a avaliação de riscos de cibersegurança para contemplar mudanças em ameaças, vulnerabilidades, ativos e contexto de negócio. Alinhado a ID.RA-06, ID.IM-03.
    - type: task_template
      name: Access rights review
      description: Review user access rights across all critical systems to ensure least-privilege and timely revocation of unnecessary access. Aligned to PR.AA-05.
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
      translations:
        fr:
          name: Revue des droits d’accès
          description: Passer en revue les droits d’accès des utilisateurs sur tous les systèmes critiques pour garantir le moindre privilège et la révocation en temps utile des accès inutiles.
        pt:
          name: Revisão de direitos de acesso
          description: Revisar os direitos de acesso dos usuários em todos os sistemas críticos para garantir o menor privilégio e a revogação tempestiva de acessos desnecessários. Alinhado a PR.AA-05.
    - type: task_template
      name: Security awareness training
      description: Deliver cybersecurity awareness training to all personnel, covering current threats, policies, phishing simulations, and expected behaviours. Aligned to PR.AT-01, PR.AT-02.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Formation de sensibilisation à la sécurité
          description: Dispenser une formation de sensibilisation à la cybersécurité à tout le personnel, couvrant les menaces actuelles, les politiques, les simulations de phishing et les comportements attendus.
        pt:
          name: Treinamento de conscientização em segurança
          description: Ministrar treinamento de conscientização em cibersegurança a todo o pessoal, abordando ameaças atuais, políticas, simulações de phishing e comportamentos esperados. Alinhado a PR.AT-01, PR.AT-02.
    - type: task_template
      name: Vulnerability scan and patch review
      description: Run vulnerability scans across all in-scope systems, review findings against patch timelines, and confirm critical and high vulnerabilities are remediated within defined SLAs. Aligned to ID.RA-01, PR.PS-02.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
      translations:
        fr:
          name: Analyse de vulnérabilités et revue des correctifs
          description: Exécuter des analyses de vulnérabilités sur tous les systèmes dans le périmètre, examiner les résultats par rapport aux délais de correction et confirmer la remédiation des vulnérabilités critiques.
        pt:
          name: Varredura de vulnerabilidades e revisão de patches
          description: Executar varreduras de vulnerabilidades em todos os sistemas no escopo, avaliar os achados em relação aos prazos de correção e confirmar que as vulnerabilidades críticas e altas sejam remediadas dentro dos SLAs definidos. Alinhado a ID.RA-01, PR.PS-02.
    - type: task_template
      name: Business continuity and recovery testing
      description: Test backup restoration, business continuity, and disaster recovery plans to verify they meet RTO/RPO targets and address current cyber incident scenarios. Aligned to RC.RP, PR.DS-11.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Test de continuité d’activité et de reprise
          description: Tester la restauration des sauvegardes, la continuité d’activité et les plans de reprise après sinistre pour vérifier qu’ils répondent aux objectifs RTO/RPO.
        pt:
          name: Teste de continuidade de negócios e recuperação
          description: Testar a restauração de backups e os planos de continuidade de negócios e de recuperação de desastres para verificar se atendem às metas de RTO/RPO e contemplam os cenários atuais de incidentes cibernéticos. Alinhado a RC.RP, PR.DS-11.
    - type: task_template
      name: Incident response tabletop exercise
      description: Conduct a tabletop exercise simulating a significant cyber incident (e.g. ransomware, data breach) to test the incident response plan, communication procedures, and recovery playbooks. Aligned to RS.MA, ID.IM-02.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Exercice sur table de réponse aux incidents
          description: Réaliser un exercice sur table simulant un incident cyber majeur (ex. rançongiciel, violation de données) pour tester le plan de réponse aux incidents et les playbooks de reprise.
        pt:
          name: Exercício de mesa (tabletop) de resposta a incidentes
          description: Conduzir um exercício de mesa (tabletop) simulando um incidente cibernético significativo (por exemplo, ransomware, violação de dados) para testar o plano de resposta a incidentes, os procedimentos de comunicação e os playbooks de recuperação. Alinhado a RS.MA, ID.IM-02.
    - type: task_template
      name: Supply chain and third-party risk review
      description: Review critical supplier security posture, validate contractual security obligations, and reassess third-party risk ratings. Aligned to GV.SC-07, ID.RA-10.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Revue des risques tiers et chaîne d’approvisionnement
          description: Revoir la posture sécurité des fournisseurs critiques, valider les obligations contractuelles et réévaluer les niveaux de risque tiers.
        pt:
          name: Revisão de risco da cadeia de suprimentos e de terceiros
          description: Revisar a postura de segurança dos fornecedores críticos, validar as obrigações contratuais de segurança e reavaliar as classificações de risco de terceiros. Alinhado a GV.SC-07, ID.RA-10.
    journey:
      steps:
      - key: context_issues
        title: Establish organisational context (GV.OC)
        description: Review and complete the pre-created organisational issues covering the internal and external factors that influence your cybersecurity programme — threat landscape, regulatory obligations, technology changes, and capability gaps.
        target_model: organisation-issues
        translations:
          fr:
            title: Établir le contexte organisationnel (GV.OC)
            description: Examinez et complétez les enjeux organisationnels pré-créés couvrant les facteurs internes et externes influençant votre programme cybersécurité.
          pt:
            title: Estabelecer o contexto organizacional (GV.OC)
            description: Revisar e completar as questões organizacionais pré-criadas que abrangem os fatores internos e externos que influenciam seu programa de cibersegurança — cenário de ameaças, obrigações regulatórias, mudanças tecnológicas e lacunas de capacidade.
      - key: objectives
        title: Define cybersecurity objectives (GV.RM)
        description: Review and refine the pre-created cybersecurity objectives covering governance, risk management, detection and response, recovery, and workforce awareness. Set measurable targets and assign owners.
        target_model: organisation-objectives
        translations:
          fr:
            title: Définir les objectifs cybersécurité (GV.RM)
            description: Examinez et affinez les objectifs cybersécurité pré-créés. Définissez des cibles mesurables et assignez des responsables.
          pt:
            title: Definir os objetivos de cibersegurança (GV.RM)
            description: Revisar e refinar os objetivos de cibersegurança pré-criados que abrangem governança, gestão de riscos, detecção e resposta, recuperação e conscientização da força de trabalho. Definir metas mensuráveis e atribuir responsáveis.
      - key: interested_parties
        title: Identify interested parties (GV.OC-02)
        description: List the stakeholders relevant to your cybersecurity programme — customers, regulators, suppliers, board, legal counsel — and document their security expectations and requirements.
        target_model: entities
        translations:
          fr:
            title: Identifier les parties intéressées (GV.OC-02)
            description: Recensez les parties prenantes pertinentes pour votre programme cybersécurité et documentez leurs attentes et exigences en matière de sécurité.
          pt:
            title: Identificar as partes interessadas (GV.OC-02)
            description: Relacionar as partes interessadas relevantes para o seu programa de cibersegurança — clientes, reguladores, fornecedores, conselho, assessoria jurídica — e documentar suas expectativas e requisitos de segurança.
      - key: roles
        title: Define roles and responsibilities (GV.RR)
        description: Assign cybersecurity roles — CISO, risk owners, security operations, incident response lead, and all staff. Document accountability lines and include cybersecurity responsibilities in personnel descriptions.
        target_model: actors
        translations:
          fr:
            title: Définir les rôles et responsabilités (GV.RR)
            description: Attribuez les rôles cybersécurité et documentez les lignes de responsabilité. Incluez les responsabilités cybersécurité dans les descriptions de poste.
          pt:
            title: Definir papéis e responsabilidades (GV.RR)
            description: Atribuir papéis de cibersegurança — CISO, responsáveis pelo risco, operações de segurança, líder de resposta a incidentes e todo o pessoal. Documentar as linhas de responsabilização e incluir as responsabilidades de cibersegurança nas descrições de cargo.
      - key: governance_policies
        title: Write and approve governance policies (GV.PO)
        description: Review all auto-created applied controls from the CSF 2.0 compliance assessment. Filter by CSF Function ‘Govern’ to focus on governance and policy controls. Assign owners, set completion dates, and document management approval for each governance policy and procedure.
        target_model: applied-controls
        translations:
          fr:
            title: Rédiger et approuver les politiques de gouvernance (GV.PO)
            description: Examinez les contrôles appliqués créés automatiquement. Filtrez par fonction CSF ‘Gouverner’ pour vous concentrer sur les contrôles de gouvernance et de politique.
          pt:
            title: Redigir e aprovar as políticas de governança (GV.PO)
            description: Revisar todos os controles aplicados criados automaticamente a partir da avaliação de conformidade do CSF 2.0. Filtrar pela Função CSF ‘Governar’ para focar nos controles de governança e políticas. Atribuir responsáveis, definir datas de conclusão e documentar a aprovação da gestão para cada política e procedimento de governança.
      - key: assets
        title: Inventory and classify assets (ID.AM)
        description: Review, complete, and classify the pre-created asset inventory. Identify hardware, software, data, and third-party dependencies. Assign business criticality ratings to inform risk prioritisation.
        target_model: assets
        translations:
          fr:
            title: Inventorier et classifier les actifs (ID.AM)
            description: Examinez, complétez et classifiez l’inventaire des actifs. Attribuez des niveaux de criticité métier pour informer la priorisation des risques.
          pt:
            title: Inventariar e classificar os ativos (ID.AM)
            description: Revisar, completar e classificar o inventário de ativos pré-criado. Identificar hardware, software, dados e dependências de terceiros. Atribuir classificações de criticidade de negócio para orientar a priorização de riscos.
      - key: risk_assessment
        title: Conduct the enterprise risk assessment (ID.RA)
        description: Work through the pre-created risk scenarios covering all six CSF 2.0 functions. Adjust likelihood and impact ratings to reflect your organisational context, add sector-specific scenarios, and document risk owners.
        target_model: risk-assessments
        target_ref: main_ra
        translations:
          fr:
            title: Mener l’évaluation des risques d’entreprise (ID.RA)
            description: Parcourez les scénarios de risque pré-créés couvrant les six fonctions du CSF 2.0. Ajustez les niveaux de vraisemblance et d’impact.
          pt:
            title: Conduzir a avaliação de riscos corporativa (ID.RA)
            description: Trabalhar sobre os cenários de risco pré-criados que abrangem todas as seis funções do CSF 2.0. Ajustar as classificações de probabilidade e impacto para refletir o contexto da sua organização, adicionar cenários específicos do setor e documentar os responsáveis pelo risco.
      - key: csf_assessment
        title: Assess current cybersecurity posture (all functions)
        description: Complete the NIST CSF 2.0 compliance assessment across all six functions. Rate each subcategory against your current implementation tier to establish a gap analysis and maturity baseline.
        target_model: compliance-assessments
        target_ref: csf_audit
        translations:
          fr:
            title: Évaluer la posture cybersécurité actuelle (toutes fonctions)
            description: Complétez l’évaluation de conformité NIST CSF 2.0 sur les six fonctions pour établir une analyse des écarts et une base de maturité.
          pt:
            title: Avaliar a postura atual de cibersegurança (todas as funções)
            description: Concluir a avaliação de conformidade do NIST CSF 2.0 em todas as seis funções. Classificar cada subcategoria em relação ao seu nível de implementação atual para estabelecer uma análise de lacunas e uma linha de base de maturidade.
      - key: target_profile
        title: Define your target profile
        description: Using the gap analysis from the compliance assessment, define your Target Profile — the desired implementation tier for each CSF subcategory. Prioritise gaps based on risk findings and business objectives.
        target_model: compliance-assessments
        target_ref: csf_audit
        translations:
          fr:
            title: Définir votre profil cible
            description: En utilisant l’analyse des écarts, définissez votre profil cible — le niveau d’implémentation souhaité pour chaque sous-catégorie. Priorisez les écarts en fonction de l’évaluation des risques.
          pt:
            title: Definir o seu perfil-alvo
            description: Com base na análise de lacunas da avaliação de conformidade, defina o seu Perfil-Alvo — o nível de implementação desejado para cada subcategoria do CSF. Priorize as lacunas conforme os achados de risco e os objetivos de negócio.
      - key: controls
        title: Implement and track security controls (PR, DE, RS, RC)
        description: Review the auto-created controls derived from CSF 2.0 reference controls. Assign owners, set target completion dates, and begin implementing the highest-priority controls.
        target_model: applied-controls
        translations:
          fr:
            title: Implémenter et suivre les mesures de sécurité (PR, DE, RS, RC)
            description: Examinez les contrôles créés automatiquement, assignez des responsables, fixez des dates cibles et commencez par les contrôles prioritaires.
          pt:
            title: Implementar e acompanhar os controles de segurança (PR, DE, RS, RC)
            description: Revisar os controles criados automaticamente a partir dos controles de referência do CSF 2.0. Atribuir responsáveis, definir datas-alvo de conclusão e iniciar a implementação dos controles de maior prioridade.
      - key: supply_chain
        title: Assess third-party and supply chain risk (GV.SC)
        description: Identify and assess your critical suppliers, managed service providers, and technology vendors. Document supply chain dependencies and review vendor security assurances.
        target_model: assets
        translations:
          fr:
            title: Évaluer les risques tiers et chaîne d’approvisionnement (GV.SC)
            description: Identifiez vos fournisseurs critiques et prestataires. Documentez les dépendances et examinez les garanties de sécurité des fournisseurs.
          pt:
            title: Avaliar o risco de terceiros e da cadeia de suprimentos (GV.SC)
            description: Identificar e avaliar seus fornecedores críticos, provedores de serviços gerenciados e fornecedores de tecnologia. Documentar as dependências da cadeia de suprimentos e revisar as garantias de segurança dos fornecedores.
      - key: detection_response
        title: Validate detection and response capabilities (DE / RS)
        description: Use this register to track findings from detection and response capability reviews — logging coverage, alerting, SIEM/MDR validation, incident response plan testing, escalation paths, and containment playbook completeness. Assign owners and track remediation.
        target_model: findings-assessments
        target_ref: detection_findings
        translations:
          fr:
            title: Valider les capacités de détection et de réponse (DE / RS)
            description: Utilisez ce registre pour suivre les constats des revues de capacités de détection et de réponse — couverture des journaux, alertes, validation SIEM/MDR et tests du plan de réponse aux incidents.
          pt:
            title: Validar as capacidades de detecção e resposta (DE / RS)
            description: Utilizar este registro para acompanhar os achados das revisões de capacidade de detecção e resposta — cobertura de logs, alertas, validação de SIEM/MDR, teste do plano de resposta a incidentes, caminhos de escalonamento e completude dos playbooks de contenção. Atribuir responsáveis e acompanhar a remediação.
      - key: recovery_bcdr
        title: Validate recovery and business continuity (RC)
        description: Use this register to track findings from backup restoration tests, BCDR plan reviews, and tabletop exercises. Document RTO/RPO validation results, gaps identified, and remediation actions required to ensure resilient recovery from cyber incidents.
        target_model: findings-assessments
        target_ref: bcdr_findings
        translations:
          fr:
            title: Valider la reprise et la continuité d’activité (RC)
            description: Utilisez ce registre pour suivre les constats des tests de restauration des sauvegardes, des revues des plans BCDR et des exercices sur table. Documentez les résultats de validation RTO/RPO et les actions de remédiation.
          pt:
            title: Validar a recuperação e a continuidade de negócios (RC)
            description: Utilizar este registro para acompanhar os achados dos testes de restauração de backups, das revisões de planos de BCDR e dos exercícios de mesa (tabletop). Documentar os resultados da validação de RTO/RPO, as lacunas identificadas e as ações de remediação necessárias para assegurar uma recuperação resiliente de incidentes cibernéticos.
      - key: ongoing_tasks
        title: Configure recurring programme tasks
        description: Review the periodic task templates — governance reviews, risk assessment reviews, access reviews, vulnerability scans, awareness training, BCDR testing, tabletop exercises, and supplier reviews — and adjust schedules to fit your organisation.
        target_model: task-templates
        translations:
          fr:
            title: Configurer les tâches récurrentes du programme
            description: Examinez les modèles de tâches périodiques et ajustez les plannings selon votre organisation.
          pt:
            title: Configurar as tarefas recorrentes do programa
            description: Revisar os modelos de tarefas periódicas — revisões de governança, revisões da avaliação de riscos, revisões de acesso, varreduras de vulnerabilidades, treinamento de conscientização, testes de BCDR, exercícios de mesa (tabletop) e revisões de fornecedores — e ajustar os cronogramas conforme a sua organização.
      - key: continuous_improvement
        title: Establish continuous improvement and review cycle (GV.OC)
        description: Schedule periodic reviews of the risk assessment, compliance assessment scores, and control effectiveness. Track progress against your Target Profile over time.
        target_model: compliance-assessments
        target_ref: csf_audit
        translations:
          fr:
            title: Établir un cycle d’amélioration continue (GV.OC)
            description: Planifiez des révisions périodiques de l’évaluation des risques, des scores de conformité et de l’efficacité des contrôles. Suivez les progrès par rapport à votre profil cible.
          pt:
            title: Estabelecer um ciclo de melhoria contínua e de revisão (GV.OC)
            description: Agendar revisões periódicas da avaliação de riscos, das pontuações da avaliação de conformidade e da eficácia dos controles. Acompanhar o progresso em relação ao seu Perfil-Alvo ao longo do tempo.
