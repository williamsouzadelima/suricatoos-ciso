description: Requisitos estruturais VINCULANTES das Regras e Procedimentos ANBIMA de Deveres Básicos das Instituições Participantes (controles internos, segregação, privacidade/LGPD, continuidade, segurança da informação e segurança cibernética) — transversais e aplicáveis à Administração de Recursos de Terceiros — somados ao detalhamento RECOMENDADO (não vinculante) do Guia ANBIMA de Cibersegurança 4ª edição. Requer validação de compliance e confirmação de versão vigente antes de uso regulatório.
