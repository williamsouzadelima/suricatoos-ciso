    description: "Requisitos avaliáveis de segurança cibernética e de terceirização de processamento/armazenamento de dados (inclusive computação em nuvem) extraídos da Circular SUSEP nº 638, de 27/07/2021, aplicável a sociedades seguradoras, entidades abertas de previdência complementar (EAPC), sociedades de capitalização e resseguradores locais. Recorte para gap-assessment de segurança cibernética das supervisionadas da SUSEP."
