urn: urn:intuitem:risk:preset:iso27001-full
locale: en
ref_id: preset-iso27001-full
name: ISO 27001:2022 — Full Implementation
description: Comprehensive ISO 27001 ISMS implementation following the Plan–Do–Check–Act cycle. Creates a compliance assessment with suggested controls, organisational context, a risk assessment, metric definitions for KPIs, and periodic task templates for ongoing management.
version: 3
provider: intuitem
packager: intuitem
translations:
  fr:
    name: ISO 27001:2022 — Mise en œuvre complète
    description: Mise en œuvre complète du SMSI ISO 27001 suivant le cycle Plan–Do–Check–Act. Crée une évaluation de conformité avec contrôles suggérés, le contexte organisationnel, une analyse de risques, des définitions de métriques pour les KPI et des modèles de tâches périodiques.
  pt:
    name: ISO 27001:2022 — Implementação Completa
    description: Implementação abrangente do SGSI conforme a ISO 27001, seguindo o ciclo PDCA (Planejar–Fazer–Verificar–Agir). Cria uma avaliação de conformidade com controles sugeridos, contexto organizacional, uma avaliação de riscos, definições de métricas para KPIs e modelos de tarefas periódicas para a gestão contínua.
dependencies:
- urn:intuitem:risk:library:iso27001-2022
- urn:intuitem:risk:library:risk-matrix-5x5-iso27005
- urn:intuitem:risk:library:intuitem-common-catalog
- urn:intuitem:risk:library:core-cybersecurity-metrics
objects:
  preset:
    profile:
      company_size:
      - sme
      - large
      industry:
      - general
      region:
      - global
      goal: iso27001-certification
    feature_flags:
      enable:
      - compliance
      - metrology
      - tprm
      - organisation_issues
      - organisation_objectives
      - tasks
      - follow_up
      - reports
    scaffolded_objects:
    - type: organisation_issue
      name: Regulatory and contractual requirements
      description: Applicable laws, regulations, and contractual obligations that impose information security requirements on the organisation (e.g. GDPR, NIS2, sector-specific regulations).
      category: legal
      origin: external
      status: active
      translations:
        fr:
          name: Exigences réglementaires et contractuelles
          description: Lois, réglementations et obligations contractuelles applicables imposant des exigences de sécurité de l’information à l’organisation (ex. RGPD, NIS2, réglementations sectorielles).
        pt:
          name: Requisitos regulatórios e contratuais
          description: Leis, regulamentos e obrigações contratuais aplicáveis que impõem requisitos de segurança da informação à organização (por exemplo, LGPD, Marco Civil da Internet, regulamentações setoriais como as do BACEN/ANPD).
    - type: organisation_issue
      name: Cyber threat landscape
      description: External threat environment including ransomware, phishing, supply-chain attacks, and emerging threats relevant to the organisation's sector and geography.
      category: technology
      origin: external
      status: active
      translations:
        fr:
          name: Paysage des cybermenaces
          description: Environnement de menaces externes incluant les rançongiciels, l’hameçonnage, les attaques de la chaîne d’approvisionnement et les menaces émergentes pertinentes pour le secteur et la géographie de l’organisation.
        pt:
          name: Cenário de ameaças cibernéticas
          description: Ambiente externo de ameaças, incluindo ransomware, phishing, ataques à cadeia de suprimentos e ameaças emergentes relevantes para o setor e a região geográfica da organização.
    - type: organisation_issue
      name: Current security maturity
      description: Internal assessment of the organisation's existing security practices, gaps, and capabilities that influence the ISMS scope and priorities.
      category: internalProcesses
      origin: internal
      status: active
      translations:
        fr:
          name: Maturité sécurité actuelle
          description: Évaluation interne des pratiques de sécurité existantes, des lacunes et des capacités de l’organisation qui influencent le périmètre et les priorités du SMSI.
        pt:
          name: Maturidade de segurança atual
          description: Avaliação interna das práticas de segurança, lacunas e capacidades existentes na organização que influenciam o escopo e as prioridades do SGSI.
    - type: organisation_objective
      name: Achieve ISO 27001 certification
      description: Obtain ISO/IEC 27001:2022 certification through a successful Stage 1 and Stage 2 audit by an accredited certification body.
      status: in_progress
      translations:
        fr:
          name: Obtenir la certification ISO 27001
          description: Obtenir la certification ISO/IEC 27001:2022 par un audit de Phase 1 et Phase 2 réussi auprès d’un organisme de certification accrédité.
        pt:
          name: Obter a certificação ISO 27001
          description: Obter a certificação ISO/IEC 27001:2022 por meio de auditorias de Estágio 1 e Estágio 2 bem-sucedidas, realizadas por um organismo de certificação acreditado.
    - type: organisation_objective
      name: Maintain acceptable risk levels
      description: Ensure all identified information security risks are treated to within the organisation's risk appetite, with residual risk formally accepted by management.
      status: draft
      translations:
        fr:
          name: Maintenir des niveaux de risque acceptables
          description: S’assurer que tous les risques de sécurité de l’information identifiés sont traités dans les limites de l’appétence au risque de l’organisation, avec un risque résiduel formellement accepté par la direction.
        pt:
          name: Manter níveis de risco aceitáveis
          description: Garantir que todos os riscos de segurança da informação identificados sejam tratados dentro do apetite a risco da organização, com o risco residual formalmente aceito pela direção.
    - type: organisation_objective
      name: Foster a security-aware culture
      description: Establish and maintain a security awareness programme so that all personnel understand their ISMS responsibilities and can recognise common threats.
      status: draft
      translations:
        fr:
          name: Favoriser une culture de sensibilisation à la sécurité
          description: Établir et maintenir un programme de sensibilisation à la sécurité pour que tout le personnel comprenne ses responsabilités SMSI et puisse reconnaître les menaces courantes.
        pt:
          name: Promover uma cultura de conscientização em segurança
          description: Estabelecer e manter um programa de conscientização em segurança para que todo o pessoal compreenda suas responsabilidades no SGSI e saiba reconhecer ameaças comuns.
    - type: risk_assessment
      name: Information Security Risk Assessment
      risk_matrix: urn:intuitem:risk:library:risk-matrix-5x5-iso27005
      ref: main_ra
      translations:
        fr:
          name: Analyse de risques sécurité de l’information
        pt:
          name: Avaliação de Riscos de Segurança da Informação
    - type: compliance_assessment
      name: ISO 27001:2022 Compliance Assessment
      framework: urn:intuitem:risk:library:iso27001-2022
      create_suggested_controls: true
      ref: iso_audit
      translations:
        fr:
          name: Évaluation de conformité ISO 27001:2022
        pt:
          name: Avaliação de Conformidade ISO 27001:2022
    - type: task_template
      name: Internal ISMS audit
      description: Conduct a full internal audit of the ISMS to verify conformity with ISO 27001 requirements and the organisation's own policies (clause 9.2).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Audit interne du SMSI
          description: Réaliser un audit interne complet du SMSI pour vérifier la conformité aux exigences ISO 27001 et aux politiques propres de l’organisation (clause 9.2).
        pt:
          name: Auditoria interna do SGSI
          description: Conduzir uma auditoria interna completa do SGSI para verificar a conformidade com os requisitos da ISO 27001 e com as políticas da própria organização (Cláusula 9.2).
    - type: task_template
      name: Management review
      description: Hold a management review meeting to evaluate ISMS performance, risk treatment effectiveness, and opportunities for improvement (clause 9.3).
      is_recurrent: true
      schedule:
        interval: 6
        frequency: MONTHLY
      translations:
        fr:
          name: Revue de direction
          description: Tenir une réunion de revue de direction pour évaluer les performances du SMSI, l’efficacité du traitement des risques et les opportunités d’amélioration (clause 9.3).
        pt:
          name: Análise crítica pela direção
          description: Realizar uma reunião de análise crítica pela direção para avaliar o desempenho do SGSI, a eficácia do tratamento de riscos e as oportunidades de melhoria (Cláusula 9.3).
    - type: task_template
      name: Access rights review
      description: Review user access rights across all critical systems to ensure least-privilege and timely revocation of unnecessary access (Annex A 5.18).
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
      translations:
        fr:
          name: Revue des droits d’accès
          description: Passer en revue les droits d’accès des utilisateurs sur tous les systèmes critiques pour garantir le moindre privilège et la révocation en temps utile des accès inutiles (Annexe A 5.18).
        pt:
          name: Revisão de direitos de acesso
          description: Revisar os direitos de acesso dos usuários em todos os sistemas críticos para assegurar o privilégio mínimo e a revogação tempestiva de acessos desnecessários (Anexo A 5.18).
    - type: task_template
      name: Risk assessment review
      description: Review and update the information security risk assessment to account for changes in threats, vulnerabilities, assets, and business context (clause 8.2).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Revue de l’analyse de risques
          description: Revoir et mettre à jour l’analyse de risques sécurité de l’information pour tenir compte des évolutions des menaces, vulnérabilités, actifs et contexte métier (clause 8.2).
        pt:
          name: Revisão da avaliação de riscos
          description: Revisar e atualizar a avaliação de riscos de segurança da informação para refletir mudanças em ameaças, vulnerabilidades, ativos e no contexto de negócio (Cláusula 8.2).
    - type: task_template
      name: Security awareness training
      description: Deliver information security awareness training to all personnel, covering current threats, policies, and expected behaviours (Annex A 6.3).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Formation de sensibilisation à la sécurité
          description: Dispenser une formation de sensibilisation à la sécurité de l’information à tout le personnel, couvrant les menaces actuelles, les politiques et les comportements attendus (Annexe A 6.3).
        pt:
          name: Treinamento de conscientização em segurança
          description: Ministrar treinamento de conscientização em segurança da informação a todo o pessoal, abordando ameaças atuais, políticas e comportamentos esperados (Anexo A 6.3).
    - type: task_template
      name: Business continuity testing
      description: Test business continuity and disaster recovery plans to verify they meet recovery objectives and address current risks (Annex A 5.30).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        fr:
          name: Test de continuité d’activité
          description: Tester les plans de continuité d’activité et de reprise après sinistre pour vérifier qu’ils répondent aux objectifs de reprise et traitent les risques actuels (Annexe A 5.30).
        pt:
          name: Teste de continuidade de negócios
          description: Testar os planos de continuidade de negócios e de recuperação de desastres para verificar se atendem aos objetivos de recuperação e abordam os riscos atuais (Anexo A 5.30).
    - type: findings_assessment
      name: Penetration Test Findings
      category: pentest
      ref: pentest_findings
      translations:
        fr:
          name: Résultats des tests d’intrusion
        pt:
          name: Achados de Teste de Invasão
    - type: metric_instance
      name: Compliance Score
      description: Overall compliance score against ISO 27001 requirements and Annex A controls.
      metric_definition: urn:intuitem:risk:metric:core:gov-01
      collection_frequency: monthly
      target_value: 85.0
      status: active
      translations:
        fr:
          name: Score de conformité
          description: Score de conformité global par rapport aux exigences ISO 27001 et aux contrôles de l’Annexe A.
        pt:
          name: Índice de Conformidade
          description: Índice geral de conformidade em relação aos requisitos da ISO 27001 e aos controles do Anexo A.
    - type: metric_instance
      name: Security Program Maturity
      description: Qualitative assessment of the ISMS maturity level across governance, processes, and technology.
      metric_definition: urn:intuitem:risk:metric:core:gov-02
      collection_frequency: quarterly
      status: active
      translations:
        fr:
          name: Maturité du programme de sécurité
          description: Évaluation qualitative du niveau de maturité du SMSI en termes de gouvernance, processus et technologie.
        pt:
          name: Maturidade do Programa de Segurança
          description: Avaliação qualitativa do nível de maturidade do SGSI nas dimensões de governança, processos e tecnologia.
    - type: metric_instance
      name: Open Critical/High Vulnerabilities
      description: Number of unresolved critical or high-severity vulnerabilities across systems in scope.
      metric_definition: urn:intuitem:risk:metric:core:vuln-01
      collection_frequency: monthly
      target_value: 0.0
      status: active
      translations:
        fr:
          name: Vulnérabilités critiques/hautes ouvertes
          description: Nombre de vulnérabilités non résolues de sévérité critique ou haute sur les systèmes du périmètre.
        pt:
          name: Vulnerabilidades Críticas/Altas em Aberto
          description: Número de vulnerabilidades críticas ou de alta severidade não resolvidas nos sistemas em escopo.
    - type: metric_instance
      name: Vulnerability Remediation Time
      description: Average number of days to remediate critical and high vulnerabilities from detection to closure.
      metric_definition: urn:intuitem:risk:metric:core:vuln-02
      collection_frequency: monthly
      target_value: 30.0
      status: active
      translations:
        fr:
          name: Délai de remédiation des vulnérabilités
          description: Nombre moyen de jours pour remédier les vulnérabilités critiques et hautes, de la détection à la clôture.
        pt:
          name: Tempo de Remediação de Vulnerabilidades
          description: Número médio de dias para remediar vulnerabilidades críticas e altas, da detecção até o encerramento.
    - type: metric_instance
      name: Security Incidents Count
      description: Total number of confirmed security incidents over the measurement period.
      metric_definition: urn:intuitem:risk:metric:core:inc-01
      collection_frequency: monthly
      target_value: 0.0
      status: active
      translations:
        fr:
          name: Nombre d’incidents de sécurité
          description: Nombre total d’incidents de sécurité confirmés sur la période de mesure.
        pt:
          name: Quantidade de Incidentes de Segurança
          description: Número total de incidentes de segurança confirmados no período de medição.
    - type: metric_instance
      name: MFA Adoption Rate
      description: Percentage of user accounts with multi-factor authentication enabled (Annex A 8.5).
      metric_definition: urn:intuitem:risk:metric:core:iam-01
      collection_frequency: monthly
      target_value: 100.0
      status: active
      translations:
        fr:
          name: Taux d’adoption du MFA
          description: Pourcentage de comptes utilisateurs avec authentification multi-facteurs activée (Annexe A 8.5).
        pt:
          name: Taxa de Adoção de MFA
          description: Percentual de contas de usuário com autenticação multifator (MFA) habilitada (Anexo A 8.5).
    - type: metric_instance
      name: Security Training Completion
      description: Percentage of personnel who completed the mandatory security awareness training (Annex A 6.3).
      metric_definition: urn:intuitem:risk:metric:core:awr-01
      collection_frequency: quarterly
      target_value: 95.0
      status: active
      translations:
        fr:
          name: Taux de complétion de la formation sécurité
          description: Pourcentage du personnel ayant suivi la formation obligatoire de sensibilisation à la sécurité (Annexe A 6.3).
        pt:
          name: Conclusão do Treinamento de Segurança
          description: Percentual do pessoal que concluiu o treinamento obrigatório de conscientização em segurança (Anexo A 6.3).
    - type: metric_instance
      name: Phishing Click Rate
      description: Percentage of users who clicked on a simulated phishing link during the latest campaign.
      metric_definition: urn:intuitem:risk:metric:core:awr-02
      collection_frequency: quarterly
      target_value: 5.0
      status: active
      translations:
        fr:
          name: Taux de clic sur phishing
          description: Pourcentage d’utilisateurs ayant cliqué sur un lien de phishing simulé lors de la dernière campagne.
        pt:
          name: Taxa de Cliques em Phishing
          description: Percentual de usuários que clicaram em um link de phishing simulado durante a campanha mais recente.
    journey:
      steps:
      - key: context_issues
        title: Establish organisational context
        description: Document internal and external factors affecting your ISMS — threats, regulatory environment, business strategy, and existing capabilities (clause 4.1).
        target_model: organisation-issues
        translations:
          fr:
            title: Établir le contexte organisationnel
            description: Documentez les facteurs internes et externes affectant votre SMSI — menaces, environnement réglementaire, stratégie métier et capacités existantes (clause 4.1).
          pt:
            title: Estabelecer o contexto organizacional
            description: Documente os fatores internos e externos que afetam o seu SGSI — ameaças, ambiente regulatório, estratégia de negócio e capacidades existentes (Cláusula 4.1).
      - key: interested_parties
        title: Identify interested parties and their requirements
        description: List the stakeholders relevant to your ISMS (customers, regulators, partners, employees) and document their information security requirements (clause 4.2). Use entities to model each interested party.
        target_model: entities
        translations:
          fr:
            title: Identifier les parties intéressées et leurs exigences
            description: Recensez les parties prenantes pertinentes pour votre SMSI (clients, régulateurs, partenaires, employés) et documentez leurs exigences en matière de sécurité de l’information (clause 4.2). Utilisez les entités pour modéliser chaque partie intéressée.
          pt:
            title: Identificar as partes interessadas e seus requisitos
            description: Liste as partes interessadas relevantes para o seu SGSI (clientes, reguladores, parceiros, colaboradores) e documente seus requisitos de segurança da informação (Cláusula 4.2). Use entidades para modelar cada parte interessada.
      - key: scope
        title: Determine ISMS scope
        description: Define the boundaries and applicability of the ISMS — which sites, systems, processes, and information are covered (clause 4.3).
        target_model: perimeters
        translations:
          fr:
            title: Déterminer le domaine d’application du SMSI
            description: Définissez les limites et l’applicabilité du SMSI — quels sites, systèmes, processus et informations sont couverts (clause 4.3).
          pt:
            title: Determinar o escopo do SGSI
            description: Defina os limites e a aplicabilidade do SGSI — quais localidades, sistemas, processos e informações estão abrangidos (Cláusula 4.3).
      - key: objectives
        title: Define information security objectives
        description: Set preliminary ISMS objectives aligned with your business strategy and risk appetite (clause 6.2).
        target_model: organisation-objectives
        translations:
          fr:
            title: Définir les objectifs de sécurité de l’information
            description: Définissez les objectifs préliminaires du SMSI alignés avec votre stratégie métier et votre appétence au risque (clause 6.2).
          pt:
            title: Definir os objetivos de segurança da informação
            description: Estabeleça objetivos preliminares do SGSI alinhados à sua estratégia de negócio e ao apetite a risco (Cláusula 6.2).
      - key: assets
        title: Identify key processes and assets
        description: Inventory primary assets (information, business processes) and supporting assets (hardware, software, networks, personnel) within the ISMS scope.
        target_model: assets
        translations:
          fr:
            title: Identifier les processus clés et les actifs
            description: Inventoriez les actifs primaires (informations, processus métier) et les actifs supports (matériel, logiciel, réseaux, personnel) dans le périmètre du SMSI.
          pt:
            title: Identificar processos e ativos principais
            description: Inventarie os ativos primários (informações, processos de negócio) e os ativos de suporte (hardware, software, redes, pessoal) dentro do escopo do SGSI.
      - key: roles
        title: Define roles and responsibilities
        description: 'Assign ISMS roles: information security manager, risk owners, asset owners. Create teams to reflect your organisation and ensure top management commitment is documented (clause 5.3).'
        target_model: actors
        translations:
          fr:
            title: Définir les rôles et responsabilités
            description: 'Attribuez les rôles SMSI : responsable sécurité, propriétaires de risques, propriétaires d’actifs. Créez des équipes pour refléter votre organisation et documentez l’engagement de la direction (clause 5.3).'
          pt:
            title: Definir papéis e responsabilidades
            description: 'Atribua os papéis do SGSI: gestor de segurança da informação, responsáveis por riscos (risk owners) e responsáveis por ativos (asset owners). Crie equipes que reflitam a sua organização e assegure que o comprometimento da alta direção esteja documentado (Cláusula 5.3).'
      - key: maturity_baseline
        title: Measure current cyber maturity
        description: Perform an initial self-assessment of the ISO 27001 requirements to baseline your current maturity level and identify the main gaps to address (clause 6.1).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          fr:
            title: Mesurer le niveau de maturité cyber actuel
            description: Réalisez une première auto-évaluation des exigences ISO 27001 pour établir votre niveau de maturité actuel et identifier les principaux écarts à combler (clause 6.1).
          pt:
            title: Medir a maturidade cibernética atual
            description: Realize uma autoavaliação inicial dos requisitos da ISO 27001 para estabelecer a linha de base do seu nível de maturidade atual e identificar as principais lacunas a serem tratadas (Cláusula 6.1).
      - key: action_plan
        title: Establish ISMS action plan
        description: 'Based on the maturity baseline, define the ISMS implementation plan: priorities, resource needs (HR, budget), milestones, and timeline.'
        target_model: applied-controls
        translations:
          fr:
            title: Établir le plan d’action du SMSI
            description: 'À partir du bilan de maturité, définissez le plan de mise en œuvre du SMSI : priorités, besoins en ressources (RH, budget), jalons et calendrier.'
          pt:
            title: Estabelecer o plano de ação do SGSI
            description: 'Com base na linha de base de maturidade, defina o plano de implementação do SGSI: prioridades, necessidades de recursos (pessoal, orçamento), marcos e cronograma.'
      - key: risk_assessment
        title: Conduct risk assessment
        description: Define risk criteria, choose an analysis method, create risk scenarios by combining threats with assets, and assess likelihood and impact (clauses 6.1.1–6.1.2).
        target_model: risk-assessments
        target_ref: main_ra
        translations:
          fr:
            title: Mener l’analyse de risque
            description: Définissez les critères d’appréciation des risques, choisissez une méthode d’analyse, créez les scénarios de risque en combinant menaces et actifs, et évaluez la vraisemblance et l’impact (clauses 6.1.1–6.1.2).
          pt:
            title: Conduzir a avaliação de riscos
            description: Defina os critérios de risco, escolha um método de análise, crie cenários de risco combinando ameaças com ativos e avalie a probabilidade e o impacto (Cláusulas 6.1.1–6.1.2).
      - key: soa
        title: Annex A self-assessment
        description: Walk through each Annex A control and assess its applicability. For each control, document whether it is included or excluded and provide a justification (clause 6.1.3 d).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          fr:
            title: Auto-évaluation Annexe A
            description: Parcourez chaque contrôle de l’Annexe A et évaluez son applicabilité. Pour chaque contrôle, documentez s’il est inclus ou exclu et fournissez une justification (clause 6.1.3 d).
          pt:
            title: Autoavaliação do Anexo A
            description: Percorra cada controle do Anexo A e avalie sua aplicabilidade. Para cada controle, documente se ele é incluído ou excluído e forneça uma justificativa (Cláusula 6.1.3 d).
      - key: soa_review
        title: Review Statement of Applicability
        description: Generate and review the Statement of Applicability (SoA) report, pre-scoped to the ISO 27001 compliance assessment and the main risk assessment with the 'SoA' implementation group.
        target_url: /reports/soa/results
        target_params:
          compliance_assessment: '{{ref:iso_audit}}'
          risk_assessments: '{{ref:main_ra}}'
          implementation_groups:
          - SoA
        translations:
          fr:
            title: Revue de la Déclaration d’Applicabilité
            description: Générez et examinez le rapport de Déclaration d’Applicabilité (DdA), pré-configuré avec l’évaluation de conformité ISO 27001, l’analyse de risques principale et le groupe d’implémentation « SoA ».
          pt:
            title: Revisar a Declaração de Aplicabilidade
            description: Gere e revise o relatório da Declaração de Aplicabilidade (DdA/SoA), pré-escopado para a avaliação de conformidade ISO 27001 e para a avaliação de riscos principal com o grupo de implementação 'SoA'.
      - key: risk_treatment
        title: Plan risk treatment
        description: Review the auto-created controls from ISO 27001 Annex A, assign owners, and define implementation plans for each applicable control (clause 8.3).
        target_model: applied-controls
        translations:
          fr:
            title: Planifier le traitement des risques
            description: Examinez les contrôles auto-créés de l’Annexe A ISO 27001, assignez des responsables et définissez les plans de mise en œuvre pour chaque contrôle applicable (clause 8.3).
          pt:
            title: Planejar o tratamento de riscos
            description: Revise os controles criados automaticamente a partir do Anexo A da ISO 27001, atribua responsáveis e defina planos de implementação para cada controle aplicável (Cláusula 8.3).
      - key: policies
        title: Write and approve policies
        description: Draft your information security policies (e.g. acceptable use, access control, incident management), define the target state of the ISMS, and submit them for management approval (clause 5.2, 7.5.1, Annex A 5.1).
        target_model: policies
        translations:
          fr:
            title: Rédiger et approuver les politiques
            description: Rédigez vos politiques de sécurité de l’information (ex. utilisation acceptable, contrôle d’accès, gestion des incidents), définissez l’état cible du SMSI et soumettez-les à l’approbation de la direction (clauses 5.2, 7.5.1, Annexe A 5.1).
          pt:
            title: Redigir e aprovar políticas
            description: Elabore suas políticas de segurança da informação (por exemplo, uso aceitável, controle de acesso, gestão de incidentes), defina o estado-alvo do SGSI e submeta-as à aprovação da direção (Cláusula 5.2, 7.5.1, Anexo A 5.1).
      - key: evidences
        title: Collect evidence
        description: Gather and organise the evidence demonstrating your ISMS implementation — documents, screenshots, logs, and records needed for audit (clause 7.5).
        target_model: evidences
        translations:
          fr:
            title: Collecter les preuves
            description: Rassemblez et organisez les preuves démontrant la mise en œuvre de votre SMSI — documents, captures d’écran, journaux et enregistrements nécessaires pour l’audit (clause 7.5).
          pt:
            title: Coletar evidências
            description: Reúna e organize as evidências que demonstram a implementação do seu SGSI — documentos, capturas de tela, logs e registros necessários para a auditoria (Cláusula 7.5).
      - key: kpis
        title: Define and track KPIs
        description: 'Set up metric instances to monitor ISMS effectiveness: compliance score, vulnerability remediation time, incident count, and other relevant KPIs (clause 9.1).'
        target_model: metric-instances
        translations:
          fr:
            title: Définir et suivre les KPI
            description: 'Configurez des instances de métriques pour suivre l’efficacité du SMSI : score de conformité, délai de remédiation des vulnérabilités, nombre d’incidents et autres KPI pertinents (clause 9.1).'
          pt:
            title: Definir e acompanhar KPIs
            description: 'Configure instâncias de métricas para monitorar a eficácia do SGSI: índice de conformidade, tempo de remediação de vulnerabilidades, quantidade de incidentes e outros KPIs relevantes (Cláusula 9.1).'
      - key: findings
        title: Track audit and pentest findings
        description: Import or create findings from penetration tests, vulnerability scans, and audits. Assign owners, set priorities, and track remediation progress.
        target_model: findings-assessments
        target_ref: pentest_findings
        translations:
          fr:
            title: Suivre les résultats d’audits et de tests
            description: Importez ou créez des résultats de tests d’intrusion, de scans de vulnérabilités et d’audits. Attribuez des responsables, définissez des priorités et suivez la remédiation.
          pt:
            title: Acompanhar achados de auditoria e de pentest
            description: Importe ou crie achados provenientes de testes de intrusão, varreduras de vulnerabilidades e auditorias. Atribua responsáveis, defina prioridades e acompanhe o progresso da remediação.
      - key: nonconformities
        title: Treat non-conformities and corrective actions
        description: Review your compliance assessment to identify non-conformities, document root causes, and implement corrective actions to close the gaps (clause 10.1).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          fr:
            title: Traiter les non-conformités et actions correctives
            description: Examinez votre évaluation de conformité pour identifier les non-conformités, documentez les causes racines et mettez en œuvre des actions correctives pour combler les écarts (clause 10.1).
          pt:
            title: Tratar não conformidades e ações corretivas
            description: Revise sua avaliação de conformidade para identificar não conformidades, documentar as causas-raiz e implementar ações corretivas para eliminar as lacunas (Cláusula 10.1).
      - key: ongoing_tasks
        title: Configure recurring ISMS tasks
        description: Review the periodic task templates (internal audits, management reviews, access reviews, awareness training) and adjust schedules to fit your organisation.
        target_model: task-templates
        translations:
          fr:
            title: Configurer les tâches récurrentes du SMSI
            description: Examinez les modèles de tâches périodiques (audits internes, revues de direction, revues d’accès, sensibilisation) et ajustez les plannings selon votre organisation.
          pt:
            title: Configurar tarefas recorrentes do SGSI
            description: Revise os modelos de tarefas periódicas (auditorias internas, análises críticas pela direção, revisões de acesso, treinamentos de conscientização) e ajuste os cronogramas conforme a sua organização.
      - key: audit_export
        title: Prepare the export for your lead auditor
        description: Generate and review the compliance assessment export to share with your certification body's lead auditor ahead of the Stage 1 or Stage 2 audit.
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          fr:
            title: Préparer l’export pour votre auditeur principal
            description: Générez et examinez l’export de l’évaluation de conformité à partager avec l’auditeur principal de votre organisme de certification avant l’audit de Phase 1 ou Phase 2.
          pt:
            title: Preparar a exportação para o seu auditor líder
            description: Gere e revise a exportação da avaliação de conformidade para compartilhar com o auditor líder do seu organismo de certificação antes da auditoria de Estágio 1 ou Estágio 2.
